<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen bg-gradient-to-br from-blue-600 to-cyan-300 flex justify-center items-center px-4">

        <form method="post" class="w-full max-w-sm">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div class="bg-white px-10 py-8 rounded-xl shadow-xl">
                <div class="space-y-4">
                    <h1 class="text-center text-2xl font-semibold text-gray-600">Iniciar sesión</h1>
                    <p class="text-center text-sm text-gray-500">Alertas y paradas de máquina</p>
                    <hr>

                    {% if form.errors %}
                        <p class="text-center text-sm text-red-500">Usuario o contraseña incorrectos.</p>
                    {% endif %}

                    <div class="flex items-center border-2 py-2 px-3 rounded-md">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                        <input class="pl-2 outline-none border-none w-full" type="text" name="username" placeholder="Usuario" required autofocus>
                    </div>

                    <div class="flex items-center border-2 py-2 px-3 rounded-md">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
                        </svg>
                        <input class="pl-2 outline-none border-none w-full" type="password" name="password" placeholder="Contraseña" required>
                    </div>
                </div>

                <button type="submit" class="mt-6 w-full shadow-xl bg-gradient-to-tr from-blue-600 to-cyan-400 hover:from-blue-700 text-white py-2 rounded-md text-lg tracking-wide transition duration-300">
                    Entrar
                </button>
            </div>
        </form>
    </div>
</body>
</html>
